<!DOCTYPE html>
<html lang="fr" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Projet 2{% endblock %} — SPMF Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background:#0d1117; color:#e6edf3; }
    .navbar { background:#161b22!important; border-bottom:1px solid #30363d; }
    .navbar-brand { font-weight:700; color:#58a6ff!important; letter-spacing:.5px; }
    .card { background:#161b22; border:1px solid #30363d; }
    .card-header { background:#21262d; border-bottom:1px solid #30363d; font-weight:600; }
    pre { background:#0d1117; border:1px solid #30363d; padding:1rem; border-radius:6px;
          font-size:.82rem; max-height:400px; overflow-y:auto; }
    .stat-num { font-size:2.8rem; font-weight:700; line-height:1; }
    .nav-link.active { color:#58a6ff!important; border-bottom:2px solid #58a6ff; }
    .badge-ok   { color:#3fb950; }
    .badge-fail { color:#f85149; }
    .form-control, .form-select { background:#0d1117; border-color:#30363d; color:#e6edf3; }
    .form-control:focus, .form-select:focus { background:#0d1117; border-color:#58a6ff; color:#e6edf3; box-shadow:none; }
    .btn-primary { background:#238636; border-color:#238636; }
    .btn-primary:hover { background:#2ea043; border-color:#2ea043; }
    .figure-card img { transition:.2s; cursor:pointer; }
    .figure-card img:hover { transform:scale(1.03); }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="/"><i class="bi bi-lightning-charge-fill"></i> SPMF Projet 2</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto gap-1">
        <li class="nav-item"><a class="nav-link {% if request.endpoint=='index' %}active{% endif %}" href="/"><i class="bi bi-house"></i> Accueil</a></li>
        <li class="nav-item"><a class="nav-link {% if request.endpoint=='generate' %}active{% endif %}" href="/generate"><i class="bi bi-plus-circle"></i> Générer</a></li>
        <li class="nav-item"><a class="nav-link {% if request.endpoint=='validate' %}active{% endif %}" href="/validate"><i class="bi bi-check-circle"></i> Valider</a></li>
        <li class="nav-item"><a class="nav-link {% if request.endpoint=='experiments' %}active{% endif %}" href="/experiments"><i class="bi bi-bar-chart"></i> Expériences</a></li>
        <li class="nav-item"><a class="nav-link {% if request.endpoint=='llm' %}active{% endif %}" href="/llm"><i class="bi bi-robot"></i> LLM</a></li>
        <li class="nav-item"><a class="nav-link {% if request.endpoint=='results' %}active{% endif %}" href="/results"><i class="bi bi-images"></i> Résultats</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container-fluid px-4 py-4" style="max-width:1200px">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
